[project]
name = "credit-service-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.128.8",
    "pydantic-settings>=2.11.0",
    "pymongo>=4.18.3",
    "uvicorn[standard]>=0.39.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import main, worker and models the same way the app does.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["config", "conftest", "main", "models", "worker", "test_worker"]
